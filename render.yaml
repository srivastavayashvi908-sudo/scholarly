# Render blueprint for the backend. Secrets marked sync: false are typed into Render's dashboard.
services:
  - type: web
    name: scholarly-api
    runtime: docker
    plan: free
    region: singapore   # closest to India; create the Neon database in Singapore too
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
